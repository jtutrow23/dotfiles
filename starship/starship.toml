"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
scan_timeout = 30
command_timeout = 800

palette = "catppuccin_mocha"

format = """
[](lavender)\
$os\
$username\
[](fg:lavender bg:blue)\
$directory\
[](fg:blue bg:green)\
$git_branch\
$git_status\
[](fg:green bg:peach)\
$nodejs\
$python\
$rust\
$golang\
$java\
$swift\
$package\
[](fg:peach bg:surface0)\
$cmd_duration\
[](fg:surface0)\
$fill\
$battery\
$time\
$line_break\
$character
"""

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[os]
disabled = false
style = "fg:crust bg:lavender"
format = "[$symbol]($style)"

[os.symbols]
Macos = "  "

[username]
show_always = false
style_user = "fg:crust bg:lavender"
format = "[$user ]($style)"

[directory]
style = "fg:crust bg:blue"
format = "[ $path ]($style)"
truncation_length = 4
truncate_to_repo = false
home_symbol = "~"
read_only = " 󰌾"

[directory.substitutions]
"Documents" = "󰈙 Documents"
"Downloads" = " Downloads"
"Desktop" = " Desktop"
"Projects" = "󰲋 Projects"
"Developer" = "󰲋 Developer"

[git_branch]
symbol = ""
style = "fg:crust bg:green"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "fg:crust bg:green"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "󰏗 ${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[nodejs]
symbol = ""
style = "fg:crust bg:peach"
format = "[ $symbol $version ]($style)"

[python]
symbol = ""
style = "fg:crust bg:peach"
format = "[ $symbol $version( \\($virtualenv\\)) ]($style)"

[rust]
symbol = ""
style = "fg:crust bg:peach"
format = "[ $symbol $version ]($style)"

[golang]
symbol = ""
style = "fg:crust bg:peach"
format = "[ $symbol $version ]($style)"

[java]
symbol = ""
style = "fg:crust bg:peach"
format = "[ $symbol $version ]($style)"

[swift]
symbol = ""
style = "fg:crust bg:peach"
format = "[ $symbol $version ]($style)"

[package]
symbol = "󰏗"
style = "fg:crust bg:peach"
format = "[ $symbol $version ]($style)"

[cmd_duration]
min_time = 2000
style = "fg:text bg:surface0"
format = "[ 󱎫 $duration ]($style)"

[fill]
symbol = " "

[battery]
full_symbol = "󰁹"
charging_symbol = "󰂄"
discharging_symbol = "󰂃"
format = "[$symbol $percentage]($style) "

[[battery.display]]
threshold = 20
style = "bold red"

[[battery.display]]
threshold = 50
style = "bold yellow"

[[battery.display]]
threshold = 100
style = "dimmed green"

[time]
disabled = false
time_format = "%I:%M %p"
style = "dimmed white"
format = "[ $time]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold mauve)"
